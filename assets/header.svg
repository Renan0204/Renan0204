<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Renan dos Santos Oliveira — Desenvolvedor Web, IA e Automacoes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1F6FEB" stroke-width="0.5" opacity="0.12"/>
    </pattern>

    <clipPath id="card">
      <rect x="2" y="2" width="896" height="246" rx="16"/>
    </clipPath>

    <clipPath id="typing">
      <rect x="42" y="150" width="0" height="28">
        <animate attributeName="width"
          values="0;0;430;430;0"
          keyTimes="0;0.05;0.5;0.9;1"
          dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- fundo -->
  <g clip-path="url(#card)">
    <rect x="0" y="0" width="900" height="250" fill="#0D1117"/>
    <rect x="0" y="0" width="900" height="250" fill="url(#grid)"/>
    <ellipse cx="740" cy="130" rx="200" ry="150" fill="url(#glow)"/>

    <!-- particulas flutuantes -->
    <circle cx="180" cy="215" r="2" fill="#58A6FF" opacity="0.5">
      <animate attributeName="cy" values="215;198;215" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="60" r="2.5" fill="#3FB950" opacity="0.4">
      <animate attributeName="cy" values="60;46;60" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="210" r="2" fill="#EA4B71" opacity="0.4">
      <animate attributeName="cy" values="210;194;210" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="70" r="2" fill="#58A6FF" opacity="0.35">
      <animate attributeName="cy" values="70;56;70" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- borda do card -->
  <rect x="2" y="2" width="896" height="246" rx="16" fill="none" stroke="#1F6FEB" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- barra superior estilo terminal -->
  <line x1="2" y1="58" x2="898" y2="58" stroke="#21262D" stroke-width="1.5"/>
  <circle cx="34" cy="32" r="5.5" fill="#FF5F56"/>
  <circle cx="54" cy="32" r="5.5" fill="#FFBD2E"/>
  <circle cx="74" cy="32" r="5.5" fill="#27C93F"/>
  <text x="98" y="37" font-family="'Fira Code','SF Mono',Consolas,monospace" font-size="12.5" fill="#6E7681">
    renan@dev:~/portfolio
  </text>

  <!-- linha de brilho correndo na borda superior -->
  <rect x="2" y="57" width="896" height="2" fill="url(#sweep)" opacity="0.9"/>

  <!-- nome -->
  <text x="42" y="112" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#F0F6FC">
    Renan dos Santos Oliveira
  </text>

  <!-- sublinhado em gradiente -->
  <rect x="42" y="124" width="0" height="3" rx="1.5" fill="url(#blue)">
    <animate attributeName="width" values="0;300;300" keyTimes="0;0.3;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- linha com efeito de digitacao -->
  <g clip-path="url(#typing)">
    <text x="42" y="171" font-family="'Fira Code','SF Mono',Consolas,monospace" font-size="18" font-weight="600" fill="#58A6FF">
      Web &#183; IA &#183; Automa&#231;&#245;es &#183; Backend
    </text>
  </g>

  <!-- cursor piscando -->
  <rect y="153" width="9" height="21" fill="#58A6FF">
    <animate attributeName="x" values="44;44;474;474;44" keyTimes="0;0.05;0.5;0.9;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- stack -->
  <text x="42" y="208" font-family="'Fira Code','SF Mono',Consolas,monospace" font-size="13" fill="#8B949E">
    React &#8226; TypeScript &#8226; Tailwind &#8226; n8n &#8226; OpenAI &#8226; Java &#8226; Spring Boot
  </text>

  <!-- atomo animado (React) -->
  <g transform="translate(742,128)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      <ellipse rx="62" ry="24" fill="none" stroke="#58A6FF" stroke-width="2" opacity="0.85"/>
      <ellipse rx="62" ry="24" fill="none" stroke="#58A6FF" stroke-width="2" opacity="0.6" transform="rotate(60)"/>
      <ellipse rx="62" ry="24" fill="none" stroke="#58A6FF" stroke-width="2" opacity="0.6" transform="rotate(120)"/>
    </g>

    <!-- eletrons -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <circle cx="62" cy="0" r="4" fill="#3FB950"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
      <circle cx="0" cy="24" r="4" fill="#EA4B71"/>
    </g>

    <!-- nucleo -->
    <circle r="8" fill="url(#blue)">
      <animate attributeName="r" values="7;9.5;7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- faisca de IA -->
  <g transform="translate(838,68)" fill="#58A6FF">
    <animateTransform attributeName="transform" type="translate" values="838,68" dur="1s"/>
    <path d="M0,-13 L3.2,-3.2 L13,0 L3.2,3.2 L0,13 L-3.2,3.2 L-13,0 L-3.2,-3.2 Z">
      <animateTransform attributeName="transform" type="scale" values="0.65;1.15;0.65" dur="3s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(660,76)" fill="#3FB950">
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z">
      <animateTransform attributeName="transform" type="scale" values="1;0.5;1" dur="4s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0.8;0.25;0.8" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- chave de codigo decorativa -->
  <text x="822" y="222" font-family="'Fira Code','SF Mono',Consolas,monospace" font-size="26" fill="#1F6FEB" opacity="0.55">
    &lt;/&gt;
  </text>

</svg>
